<style>
/* Polices Barlow et Barlow Condensed auto-hébergées (SIL Open Font License 1.1, voir fonts/OFL-*.txt) */
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
:root{
  --paper:#F2F5F3; --card:#FFFFFF; --ink:#14262B; --slate:#56676C; --line:#D5DDDA;
  --sign:#0E6B4E; --sign-deep:#0A543D; --lane:#F4C430; --alert:#B3261E; --perso:#2B5C8A;
  --r-sm:6px; --r-md:10px; --r-sign:18px;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-sign:"Barlow Condensed","Barlow","Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.5 var(--f-body)}
.wrap{max-width:920px;margin:0 auto;padding:0 18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lane);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.brand{font:700 26px/1 var(--f-sign);letter-spacing:.01em;display:flex;align-items:center;gap:9px}
.brand svg{width:30px;height:30px}
.lang{border:1.5px solid var(--ink);background:none;border-radius:var(--r-sm);padding:5px 11px;font-weight:600;cursor:pointer}

/* the highway sign */
.sign{background:var(--sign);color:#fff;border-radius:var(--r-sign);padding:7px;box-shadow:0 2px 0 var(--sign-deep)}
.sign-in{border:3px solid #fff;border-radius:12px;padding:26px 24px 24px;display:grid;gap:22px;grid-template-columns:1fr}
.sign h1{font:700 clamp(38px,8.2vw,68px)/.98 var(--f-sign);margin:0;letter-spacing:.005em;max-width:13ch}
.sign p{margin:12px 0 0;max-width:44ch;font-size:18px;color:#E4F1EC}
.odo-block{align-self:end}
.odo-cap{font:600 17px/1.2 var(--f-sign);letter-spacing:.02em;margin-bottom:8px;color:#E4F1EC}
.odo{display:inline-flex;gap:3px;background:var(--ink);padding:6px;border-radius:8px;border:2px solid #fff}
.odo span{display:block;width:34px;height:50px;overflow:hidden;background:#0B171A;border-radius:4px;position:relative}
.odo span i{display:block;font:600 38px/50px var(--f-sign);font-style:normal;text-align:center;color:#fff;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.odo span.tenth{background:var(--lane)}
.odo span.tenth i{color:var(--ink)}
.odo-sub{margin-top:9px;font-size:15.5px;color:#E4F1EC}
@media (min-width:760px){.sign-in{grid-template-columns:1.25fr auto;padding:34px 34px 30px}.odo span{width:40px;height:58px}.odo span i{font-size:44px;line-height:58px}}
@media (prefers-reduced-motion:reduce){.odo span i{transition:none}}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 0;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper);z-index:5;padding-top:6px}
.tabs button{flex:1;border:0;background:none;padding:11px 6px 10px;font:600 19px/1 var(--f-sign);letter-spacing:.02em;cursor:pointer;border-radius:var(--r-sm) var(--r-sm) 0 0;color:var(--slate)}
.tabs button[aria-selected="true"]{background:var(--ink);color:#fff}
.panel{padding:22px 0 8px}
.panel[hidden]{display:none}

h2{font:700 30px/1.1 var(--f-sign);margin:0 0 12px}
h3{font:600 21px/1.2 var(--f-sign);margin:0 0 8px}
.muted{color:var(--slate)}
.small{font-size:15px}

/* forms */
.form{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r-md);padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid .full{grid-column:1/-1}
@media (min-width:700px){.grid.g4{grid-template-columns:1fr 1fr 1fr 1fr}.grid.g4 .half{grid-column:span 2}}
label{display:block;font-weight:500;font-size:15px;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],select{width:100%;border:1.5px solid #A9B6B2;border-radius:var(--r-sm);padding:10px 11px;background:#fff;min-height:46px}
input:focus,select:focus{border-color:var(--sign)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden}
.seg label{flex:1;margin:0;text-align:center;padding:10px 6px;cursor:pointer;font-weight:600;font-size:16px}
.seg input{position:absolute;opacity:0}
.seg input:checked+span{color:#fff}
.seg label:has(input:checked){background:var(--ink);color:#fff}
.seg label:has(input:focus-visible){outline:3px solid var(--lane);outline-offset:-3px}
.check{display:flex;gap:9px;align-items:center;font-weight:400;font-size:16px;margin:0}
.check input{width:20px;height:20px;accent-color:var(--sign)}
.btn{border:0;border-radius:var(--r-sm);padding:12px 18px;font-weight:600;cursor:pointer;background:var(--sign);color:#fff;min-height:46px}
.btn:hover{background:var(--sign-deep)}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.alt:hover{background:#E9EEEC}
.btn.lane{background:var(--lane);color:var(--ink)}
.btn.lane:hover{background:#E6B520}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
details.more{margin-top:2px}
details.more summary{cursor:pointer;font-weight:500;font-size:15.5px;color:var(--sign-deep);padding:4px 0}
.msg{margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);font-size:15.5px}
.msg.err{background:#FBE9E7;color:var(--alert);border:1px solid #F0B8B2}
.msg.ok{background:#E3F2EC;color:var(--sign-deep);border:1px solid #B5D9CB}
.msg.warn{background:#FFF6D6;color:#5C4700;border:1px solid #EBD688}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chip{border:1.5px solid var(--sign);color:var(--sign-deep);background:#fff;border-radius:999px;padding:6px 12px;font-size:15px;font-weight:500;cursor:pointer}
.chip:hover{background:#E3F2EC}

/* lists */
.month{margin-top:22px}
.month-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1.5px solid var(--ink);padding-bottom:4px}
.month-h b{font:600 21px/1.2 var(--f-sign);text-transform:capitalize}
.item{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line)}
.item .d{font:600 17px/1.3 var(--f-sign);color:var(--slate)}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .s{font-size:15px;color:var(--slate);overflow-wrap:anywhere}
.item .v{text-align:right;font:600 20px/1.2 var(--f-sign);white-space:nowrap}
.tag{display:inline-block;font-size:13px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.p{background:#E1ECF6;color:var(--perso)}
.del{border:0;background:none;color:var(--slate);cursor:pointer;font-size:14px;text-decoration:underline;padding:2px 0;display:block;margin-left:auto}
.del:hover{color:var(--alert)}
.empty{padding:26px 0;color:var(--slate)}

/* summary */
.sum{display:grid;gap:0;border:1.5px solid var(--ink);border-radius:var(--r-md);overflow:hidden;background:#fff;margin-top:14px}
.sum div{display:flex;justify-content:space-between;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}
.sum div.big{background:var(--ink);color:#fff}
.sum b{font:600 21px/1.2 var(--f-sign);white-space:nowrap}
.sum div.big b{font-size:26px;color:var(--lane)}
.yearbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.yearbar>div{flex:1;min-width:130px}

/* pro */
.plans{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:760px){.plans{grid-template-columns:1fr 1fr 1fr}}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:var(--r-md);padding:18px}
.plan.pro{border:2px solid var(--ink)}
.plan .price{font:700 40px/1 var(--f-sign);margin:6px 0 10px}
.plan .price small{font:500 17px var(--f-body);color:var(--slate)}
.plan ul{margin:0 0 14px;padding-left:20px}
.plan li{margin:4px 0}
.badge{display:inline-block;background:var(--lane);color:var(--ink);font-weight:600;font-size:14px;border-radius:4px;padding:2px 8px}

/* faq */
.faq{margin-top:34px;padding-top:26px;border-top:2px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font:600 21px/1.25 var(--f-sign)}
.faq details p{margin:8px 0 2px;max-width:68ch}
footer{margin:34px 0 0;padding:20px 0 40px;font-size:15px;color:var(--slate);border-top:1px solid var(--line)}
footer p{margin:0 0 6px;max-width:75ch}

/* print register */
#print{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  body>*:not(#print){display:none!important}
  #print{display:block;padding:0}
  #print h1{font:700 20pt var(--f-sign);margin:0 0 4pt}
  #print table{width:100%;border-collapse:collapse;margin-top:10pt;font-size:9.5pt}
  #print th,#print td{border:1px solid #777;padding:3pt 5pt;text-align:left;vertical-align:top}
  #print th{background:#eee}
  #print td.n,#print th.n{text-align:right;white-space:nowrap}
  #print .meta{display:grid;grid-template-columns:1fr 1fr;gap:2pt 20pt;font-size:10pt;margin-top:6pt}
  #print .foot{margin-top:10pt;font-size:8.5pt;color:#444}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#0E6B4E"/><rect x="4" y="4" width="24" height="24" rx="4.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M16 8v4M16 15v4M16 22v3" stroke="#F4C430" stroke-width="2.6" stroke-linecap="round"/></svg>
    CarnetKM
  </div>
  <button class="lang" id="langBtn" type="button" aria-label="Switch to English">EN</button>
</header>

<section class="sign" aria-labelledby="h1">
  <div class="sign-in">
    <div>
      <h1 id="h1" data-i="hero_h"></h1>
      <p data-i="hero_p"></p>
    </div>
    <div class="odo-block">
      <div class="odo-cap" id="odoCap"></div>
      <div class="odo" id="odo" role="img" aria-label=""></div>
      <div class="odo-sub" id="odoSub"></div>
    </div>
  </div>
</section>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" id="t-trips" aria-controls="p-trips" aria-selected="true" data-tab="trips" data-i="tab_trips"></button>
  <button role="tab" id="t-exp" aria-controls="p-exp" aria-selected="false" data-tab="exp" data-i="tab_exp"></button>
  <button role="tab" id="t-sum" aria-controls="p-sum" aria-selected="false" data-tab="sum" data-i="tab_sum"></button>
  <button role="tab" id="t-pro" aria-controls="p-pro" aria-selected="false" data-tab="pro" data-i="tab_pro"></button>
</nav>

<main>
<!-- TRIPS -->
<section class="panel" id="p-trips" role="tabpanel" aria-labelledby="t-trips">
  <h2 data-i="trips_h"></h2>
  <div class="chips" id="favs"></div>
  <form class="form" id="tripForm" novalidate>
    <div class="grid g4">
      <div><label for="tDate" data-i="f_date"></label><input type="date" id="tDate" required></div>
      <div>
        <span class="sr" id="tTypeL" data-i="f_type"></span>
        <label aria-hidden="true" data-i="f_type"></label>
        <div class="seg" role="radiogroup" aria-labelledby="tTypeL">
          <label><input type="radio" name="tType" value="b" checked><span data-i="type_b"></span></label>
          <label><input type="radio" name="tType" value="p"><span data-i="type_p"></span></label>
        </div>
      </div>
      <div class="half"><label for="tPurpose" data-i="f_purpose"></label><input type="text" id="tPurpose" list="purposes" maxlength="80" autocomplete="off"><datalist id="purposes"></datalist></div>
      <div class="half"><label for="tFrom" data-i="f_from"></label><input type="text" id="tFrom" maxlength="80" autocomplete="off"></div>
      <div class="half"><label for="tTo" data-i="f_to"></label><input type="text" id="tTo" maxlength="80" autocomplete="off"></div>
      <div><label for="tKm" data-i="f_km"></label><input type="number" id="tKm" inputmode="decimal" min="0" step="0.1"></div>
      <div class="full">
        <details class="more"><summary data-i="odo_more"></summary>
          <div class="grid" style="margin-top:8px">
            <div><label for="tO1" data-i="f_o1"></label><input type="number" id="tO1" inputmode="numeric" min="0" step="1"></div>
            <div><label for="tO2" data-i="f_o2"></label><input type="number" id="tO2" inputmode="numeric" min="0" step="1"></div>
          </div>
        </details>
      </div>
      <div class="full"><label class="check"><input type="checkbox" id="tFav"><span data-i="f_fav"></span></label></div>
      <div class="full row"><button class="btn" type="submit" data-i="add_trip"></button></div>
    </div>
    <div id="tripMsg" role="status"></div>
  </form>
  <p id="quota" class="muted small" role="status" style="margin:12px 0 0"></p>
  <div id="tripList"></div>
</section>

<!-- EXPENSES -->
<section class="panel" id="p-exp" role="tabpanel" aria-labelledby="t-exp" hidden>
  <h2 data-i="exp_h"></h2>
  <form class="form" id="expForm" novalidate>
    <div class="grid g4">
      <div><label for="eDate" data-i="f_date"></label><input type="date" id="eDate" required></div>
      <div class="half"><label for="eCat" data-i="f_cat"></label><select id="eCat"></select></div>
      <div><label for="eAmt" data-i="f_amt"></label><input type="number" id="eAmt" inputmode="decimal" min="0" step="0.01"></div>
      <div class="full"><label for="eNote" data-i="f_note"></label><input type="text" id="eNote" maxlength="80" autocomplete="off"></div>
      <div class="full"><label class="check"><input type="checkbox" id="eTax"><span data-i="f_tax"></span></label></div>
      <div class="full row"><button class="btn" type="submit" data-i="add_exp"></button><span class="muted small" id="eHint"></span></div>
    </div>
    <div id="expMsg" role="status"></div>
  </form>
  <div id="expList"></div>
</section>

<!-- SUMMARY -->
<section class="panel" id="p-sum" role="tabpanel" aria-labelledby="t-sum" hidden>
  <h2 data-i="sum_h"></h2>
  <div class="form">
    <div class="yearbar">
      <div><label for="sYear" data-i="f_year"></label><select id="sYear"></select></div>
      <div><label for="sO1" data-i="f_yo1"></label><input type="number" id="sO1" inputmode="numeric" min="0" step="1"></div>
      <div><label for="sO2" data-i="f_yo2"></label><input type="number" id="sO2" inputmode="numeric" min="0" step="1"></div>
    </div>
    <div class="grid">
      <div><label for="sName" data-i="f_name"></label><input type="text" id="sName" maxlength="60" autocomplete="name"></div>
      <div><label for="sVeh" data-i="f_veh"></label><input type="text" id="sVeh" maxlength="60" autocomplete="off"></div>
      <div><label for="sProv" data-i="f_prov"></label><select id="sProv"></select></div>
      <div style="align-self:end"><label class="check" style="min-height:46px"><input type="checkbox" id="sReg"><span data-i="f_reg"></span></label></div>
    </div>
  </div>
  <div id="sumWarn"></div>
  <div class="sum" id="sumBox"></div>
  <p class="muted small" data-i="sum_note" style="max-width:75ch"></p>
  <div class="row" style="margin-top:6px">
    <button class="btn" type="button" id="bPrint" data-i="b_print"></button>
    <button class="btn alt" type="button" id="bCsvT" data-i="b_csvt"></button>
    <button class="btn alt" type="button" id="bCsvE" data-i="b_csve"></button>
  </div>
  <div id="expMsg2" role="status"></div>
</section>

<!-- PRO -->
<section class="panel" id="p-pro" role="tabpanel" aria-labelledby="t-pro" hidden>
  <h2 data-i="pro_h"></h2>
  <div id="proFlash" role="status"></div>
  <div id="proState"></div>
  <div class="plans">
    <div class="plan" id="planFree">
      <h3 data-i="plan_free"></h3>
      <div class="price">0 $</div>
      <ul id="freeList"></ul>
      <div id="freeBadge"></div>
    </div>
    <div class="plan" id="planPlus">
      <h3 data-i="plan_plus"></h3>
      <div class="price"><span id="plusPrice"></span> <small data-i="per_month"></small></div>
      <ul id="plusList"></ul>
      <div id="plusBuy"></div>
    </div>
    <div class="plan pro" id="planPro">
      <h3 data-i="plan_pro"></h3>
      <div class="price"><span id="proPrice"></span> <small data-i="per_month"></small></div>
      <ul id="proList"></ul>
      <div id="proBuy"></div>
    </div>
  </div>
  <div class="form" style="margin-top:16px" id="bunBox">
    <h3 data-i="bun_h"></h3>
    <p class="muted small" data-i="bun_p" style="margin:0 0 10px"></p>
    <p class="small" id="bunSoon" style="margin:0 0 10px"></p>
    <div class="row" id="bunForm">
      <div style="flex:1;min-width:220px"><label for="bunCode" data-i="bun_l"></label><input type="text" id="bunCode" autocomplete="off" spellcheck="false" maxlength="20"></div>
      <button class="btn" type="button" id="bBun" data-i="bun_b" style="align-self:end"></button>
    </div>
    <div id="bunMsg" role="status"></div>
  </div>
  <div class="form" style="margin-top:16px" id="licBox">
    <h3 data-i="lic_h"></h3>
    <div class="row">
      <div style="flex:1;min-width:220px"><label for="licKey" data-i="lic_l"></label><input type="text" id="licKey" autocomplete="off" spellcheck="false" placeholder="XXXXXXXX-XXXXXXXX-XXXXXXXX-XXXXXXXX"></div>
      <button class="btn" type="button" id="bLic" data-i="lic_b" style="align-self:end"></button>
    </div>
